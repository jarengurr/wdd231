   <h1>Form to Join the Chamber of Commerce</h1>
    <main class="mymain">
       <form method="GET" action="thanks.html" class="designOne">
        <label>First Name <input type="text" name="first" required autocomplete="given-name" title="Your First Name" autofocus></label>
        <label>Last Name <input type="text" name="last" required autocomplete="family-name" title="Your Last Name"></label>
        <label>Mobile Phone <input type="tel" name="phone" required autocomplete="tel" title="A Phone Number with dashes" placeholder="888-555-1234" ></label>
        <label>Email <input type="email" name="email" required placeholder="bill238@gmail.com"  title="Your Email" autocomplete="email"></label>
        <label>Organizational Title <input type="text" name="title" pattern="[-A-Za-z ]{7}$" autocomplete="organization-title" title="Your Title in your Company or Organizational Title"></label>
        <label>Organizational Name <input type="text" name="name" required  title="The Name of your Organization" autocomplete="organization"></label>
        <input type="hidden" id="theDate" name="timestamp" title="time and day" value="">

        <label for="discription">Organization Discription</label>
        <textarea id="discription" name="discription" title="A Discription of your Organization" rows="4" cols="50"></textarea>

        <label>Please Choose a Membership Option
            <select name="membership" id="level" required>
                <option value="" disabled selected>Choose a Paid Membership or the No-Fee Membership</option>
                <option value="np">No Fee Non-Profit Membership</option>
                <option value="bronze">Bronze Membership</option>
                <option value="silver">Silver Membership</option>
                <option value="gold">Gold Membership</option>
            </select>
        </label>
        <br><br>
        <input type="submit" value="Join the Victorville Chamber of Commerce" class="sub">
       </form>
       <section>
            <div class="gold">
                <h2>Gold Membership</h2>
                <button id="bgold">Learn More</button>
            </div>
            <div class="sliver">
                <h2>Silver Membership</h2>
                <button id="bsilver">Learn More</button>
            </div>
            <div class="bronze">
                <h2>Bronze Membership</h2>
                <button id="bbronze">Learn More</button>
            </div>
            <div class="none">
                <h2>Non-Profit Membership</h2>
                <button id="bnone">Learn More</button>
            </div>
            <div id="showmodal" class="themodal"></div>
