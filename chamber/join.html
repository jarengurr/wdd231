    <main class="mymain">
       <form method="GET" action="thanks.html" class="designOne">
        <label>First Name <input type="text" name="first" required autocomplete="given-name" title="Your First Name"></label>
        <label>Last Name <input type="text" name="last" required autocomplete="family-name" title="Your Last Name"></label>
        <label>Mobile Phone <input type="tel" name="phone"  autocomplete="tel" title="A Phone Number with dashes" placeholder="888-555-1234" ></label>
        <label>Email <input type="email" name="email" required placeholder="bill238@gmail.com"  title="Your Email" autocomplete="email"></label>
        <label>organizational title <input type="text" name="title" pattern="[a-z][A-Z][ -]"   autocomplete="organization-title" title="Your Company Title"></label>
        
        <label>Choose a Membership Option
            <select name="membership" id="level">
                <option value="np">No Fee Non-Profit Membership</option>
                <option value="bronze">Bronze Membership</option>
                <option value="silver">Silver Membership</option>
                <option value="gold">Gold Membership</option>
            </select>
        </label>
        <br><br>
        <input type="submit" value="Submit">
       </form>
